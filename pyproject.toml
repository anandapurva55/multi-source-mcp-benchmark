[project]
name = "multi-source-mcp-benchmark"
version = "0.1.0"
description = "A reproducible benchmark for evaluating AI agents on multi-source evidence investigation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Apurva Anand" }]
dependencies = [
  "mcp>=2",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
extend-exclude = ["scenarios"]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-m 'not docker'"
markers = ["docker: needs a running Docker daemon (builds the image and starts scenario containers)"]
