<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Judge calibration by model</title>
<rect width="900" height="500" rx="18" fill="#0b1220"/>
<text x="40" y="48" font-size="22" fill="#f1f5f9" text-anchor="start" font-weight="700">Which model is fit to be the judge?</text>
<text x="40" y="72" font-size="13" fill="#94a3b8" text-anchor="start" font-weight="400">Average score each judge gives three answers of known quality. Short lines mark the required limit.</text>
<rect x="40" y="89" width="14" height="14" rx="3" fill="#34d399"/>
<text x="62" y="100" font-size="13" fill="#94a3b8" text-anchor="start" font-weight="400">correct reference answer</text>
<rect x="252.8" y="89" width="14" height="14" rx="3" fill="#fbbf24"/>
<text x="274.8" y="100" font-size="13" fill="#94a3b8" text-anchor="start" font-weight="400">confident wrong answer</text>
<rect x="451.20000000000005" y="89" width="14" height="14" rx="3" fill="#94a3b8"/>
<text x="473.20000000000005" y="100" font-size="13" fill="#94a3b8" text-anchor="start" font-weight="400">answer that found nothing</text>
<line x1="80" y1="390.0" x2="860" y2="390.0" stroke="#243049"/>
<text x="70" y="394.0" font-size="12" fill="#94a3b8" text-anchor="end" font-weight="400">0%</text>
