<line x1="179.0" y1="282.0" x2="241.0" y2="282.0" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="248.0" y="373.35" width="52" height="16.65" rx="5" fill="#94a3b8" opacity="1"/>
