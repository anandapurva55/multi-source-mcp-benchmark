<text x="70" y="259.0" font-size="12" fill="#94a3b8" text-anchor="end" font-weight="400">50%</text>
<line x1="80" y1="187.5" x2="860" y2="187.5" stroke="#243049"/>
<text x="70" y="191.5" font-size="12" fill="#94a3b8" text-anchor="end" font-weight="400">75%</text>
<line x1="80" y1="120.0" x2="860" y2="120.0" stroke="#243049"/>
<text x="70" y="124.0" font-size="12" fill="#94a3b8" text-anchor="end" font-weight="400">100%</text>
<rect x="120.0" y="188.49" width="52" height="201.51" rx="5" fill="#34d399" opacity="0.45"/>
<text x="146.0" y="180.49" font-size="13" fill="#f1f5f9" text-anchor="middle" font-weight="600">75%</text>
<line x1="115.0" y1="160.5" x2="177.0" y2="160.5" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="4 3"/>
