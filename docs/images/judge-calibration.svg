<text x="730.0" y="380" font-size="13" fill="#f1f5f9" text-anchor="middle" font-weight="600">0%</text>
<line x1="699.0" y1="282.0" x2="761.0" y2="282.0" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="768.0" y="388" width="52" height="2" rx="5" fill="#94a3b8" opacity="1"/>
<text x="794.0" y="380" font-size="13" fill="#f1f5f9" text-anchor="middle" font-weight="600">0%</text>
<line x1="763.0" y1="349.5" x2="825.0" y2="349.5" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="4 3"/>
<text x="730.0" y="412" font-size="14" fill="#f1f5f9" text-anchor="middle" font-weight="600">llama3.1:8b</text>
<text x="730.0" y="432" font-size="12" fill="#34d399" text-anchor="middle" font-weight="600">passes calibration</text>
<text x="40" y="482" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">Limits: reference at least 85%, wrong answer at most 40%, non-answer at most 15%. Faded bars missed their limit.</text>
</svg>
