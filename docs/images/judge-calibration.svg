<text x="470.0" y="432" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="600">fails calibration</text>
<rect x="640.0" y="120.0" width="52" height="270.0" rx="5" fill="#34d399" opacity="1"/>
