<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Architecture: an agent reaches MCP servers in a no-network sandbox; its answer is scored by a claim-based judge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c33"/></linearGradient>
    <linearGradient id="gSand" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="gAgent" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="gJudge" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="gScore" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="gClaims" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30,0 H0 V30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="620" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="20" fill="url(#grid)"/>

  <!-- title -->
  <text x="40" y="52" font-size="22" font-weight="700" fill="#f1f5f9">From question to score</text>
  <text x="40" y="76" font-size="13" fill="#94a3b8">Tool-using agents investigate conflicting evidence in an isolated sandbox. Answers are graded claim by claim.</text>

  <!-- step markers -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#0b1220">
    <circle cx="60" cy="130" r="14" fill="#a78bfa"/><text x="60" y="135">1</text>
    <circle cx="330" cy="130" r="14" fill="#38bdf8"/><text x="330" y="135">2</text>
    <circle cx="900" cy="130" r="14" fill="#34d399"/><text x="900" y="135">3</text>
  </g>
  <g font-size="12" font-weight="600" fill="#cbd5e1" letter-spacing="1.2">
    <text x="82" y="135">ASK</text><text x="352" y="135">INVESTIGATE</text><text x="922" y="135">SCORE</text>
  </g>

  <!-- AGENT -->
  <rect x="40" y="160" width="230" height="250" rx="16" fill="#1e1b4b" stroke="url(#gAgent)" stroke-width="2.5" filter="url(#glow)"/>
  <text x="155" y="196" text-anchor="middle" font-size="19" font-weight="700" fill="#ede9fe">Agent model</text>
  <text x="155" y="219" text-anchor="middle" font-size="13" fill="#c4b5fd">runs locally, no cost per token</text>
  <!-- ollama + llama pills -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="62" y="240" width="186" height="34" rx="17" fill="#ffffff"/>
    <circle cx="86" cy="257" r="9" fill="#0b1220"/><circle cx="86" cy="255" r="3.2" fill="#ffffff"/><rect x="82.6" y="259" width="6.8" height="3" rx="1.5" fill="#ffffff"/>
    <text x="156" y="262" fill="#0b1220">Ollama</text>
    <rect x="62" y="284" width="186" height="34" rx="17" fill="#2563eb"/>
    <path d="M76,301 q4,-8 8,0 q4,8 8,0" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="170" y="306" fill="#ffffff">Qwen 2.5 7B (default)</text>
  </g>
  <text x="155" y="352" text-anchor="middle" font-size="12" fill="#a5b4fc">reads brief.md</text>
  <text x="155" y="372" text-anchor="middle" font-size="12" fill="#a5b4fc">chooses tools, writes answer</text>
  <text x="155" y="392" text-anchor="middle" font-size="12" fill="#a5b4fc">any MCP-capable LLM works</text>

  <!-- SANDBOX -->
  <rect x="300" y="160" width="520" height="400" rx="18" fill="#0f1a2e" stroke="url(#gSand)" stroke-width="2.5" stroke-dasharray="12 7" filter="url(#glow)"/>
  <text x="326" y="194" font-size="18" font-weight="700" fill="#e0f2fe">Sandbox container</text>
  <!-- lock + pills -->
  <g font-size="12" font-weight="700">
    <rect x="560" y="174" width="116" height="26" rx="13" fill="#052e2b" stroke="#2dd4bf"/>
    <rect x="570" y="184" width="10" height="8" rx="1.5" fill="#2dd4bf"/><path d="M572,184 v-3 a3,3 0 0 1 6,0 v3" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="588" y="192" fill="#5eead4">no network</text>
    <rect x="686" y="174" width="116" height="26" rx="13" fill="#052e2b" stroke="#2dd4bf"/>
    <text x="744" y="192" text-anchor="middle" fill="#5eead4">read-only data</text>
  </g>

  <!-- servers -->
  <g text-anchor="middle">
    <rect x="326" y="220" width="224" height="62" rx="12" fill="#13233d" stroke="#38bdf8" stroke-opacity="0.7"/>
    <text x="438" y="246" font-size="15" font-weight="700" fill="#e0f2fe">filesystem</text>
    <text x="438" y="267" font-size="12" fill="#7dd3fc">read_text_file · list_directory</text>
    <rect x="570" y="220" width="224" height="62" rx="12" fill="#13233d" stroke="#38bdf8" stroke-opacity="0.7"/>
    <text x="682" y="246" font-size="15" font-weight="700" fill="#e0f2fe">code-executor</text>
    <text x="682" y="267" font-size="12" fill="#7dd3fc">execute_code · Python + SQLite</text>
    <rect x="326" y="296" width="224" height="62" rx="12" fill="#13233d" stroke="#38bdf8" stroke-opacity="0.7"/>
    <text x="438" y="322" font-size="15" font-weight="700" fill="#e0f2fe">git</text>
    <text x="438" y="343" font-size="12" fill="#7dd3fc">git_log · git_show</text>
    <rect x="570" y="296" width="224" height="62" rx="12" fill="#2a2210" stroke="#fbbf24" stroke-dasharray="5 4"/>
    <text x="682" y="322" font-size="15" font-weight="700" fill="#fef3c7">calculator</text>
    <text x="682" y="343" font-size="12" fill="#fcd34d">distractor tool</text>
  </g>
  <text x="560" y="382" text-anchor="middle" font-size="12" fill="#64748b">4 MCP servers: tools, not models. Pinned and preinstalled at build time</text>

  <!-- evidence -->
  <rect x="326" y="400" width="468" height="136" rx="14" fill="#06262b" stroke="#2dd4bf" stroke-width="1.8"/>
  <text x="560" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#ccfbf1">/workspace/evidence</text>
  <g font-size="12.5" fill="#99f6e4" text-anchor="middle">
    <text x="560" y="452">ledger CSV · settlement SQLite · policy notes</text>
    <text x="560" y="472">load-test runs · metrics definitions · rollout memo</text>
    <text x="560" y="492">app logs · deploy log · SLA · real git history</text>
    <text x="560" y="518" font-size="12" font-style="italic" fill="#2dd4bf">sources disagree by design</text>
  </g>

  <!-- SCORING -->
  <g text-anchor="middle">
    <rect x="850" y="160" width="310" height="92" rx="16" fill="#2a2210" stroke="url(#gClaims)" stroke-width="2.5"/>
    <text x="1005" y="196" font-size="17" font-weight="700" fill="#fef3c7">claims.yaml</text>
    <text x="1005" y="218" font-size="13" fill="#fcd34d">7 to 8 independent, checkable facts</text>
    <text x="1005" y="236" font-size="13" fill="#fcd34d">per scenario</text>

    <rect x="850" y="272" width="310" height="130" rx="16" fill="#1e1b4b" stroke="url(#gJudge)" stroke-width="2.5" filter="url(#glow)"/>
    <text x="1005" y="300" font-size="17" font-weight="700" fill="#e0e7ff">Judge model (grade.py)</text>
    <rect x="905" y="311" width="200" height="28" rx="14" fill="#4f46e5"/>
    <text x="1005" y="330" font-size="13" font-weight="700" fill="#ffffff">GPT-4.1 mini (recommended)</text>
    <text x="1005" y="360" font-size="13" fill="#a5b4fc">hosted API, billed per token</text>
    <text x="1005" y="380" font-size="13" fill="#a5b4fc">answer treated as data, strict score</text>

    <rect x="850" y="428" width="310" height="96" rx="16" fill="#052e1f" stroke="url(#gScore)" stroke-width="2.5"/>
    <text x="1005" y="458" font-size="17" font-weight="700" fill="#d1fae5">Score (plain code, no model)</text>
    <text x="1005" y="482" font-size="13" fill="#6ee7b7">0 to 3 per claim, minus penalties</text>
    <text x="1005" y="502" font-size="13" fill="#6ee7b7">weighted total, partial credit</text>
  </g>

  <!-- arrows -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M270,250 L298,250"/>
    <path d="M298,300 L272,300"/>
    <path d="M1005,252 L1005,270"/>
    <path d="M1005,402 L1005,426"/>
    <path d="M560,386 L560,398" stroke-width="1.5"/>
    <path d="M155,410 L155,588 L835,588 L835,336 L848,336" stroke-dasharray="6 5"/>
  </g>
  <g font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">
    <text x="284" y="242">tool</text><text x="284" y="288">out</text>
    <text x="495" y="580">final written answer</text>
  </g>

  <!-- reference answer note -->
  <g>
    <rect x="850" y="548" width="310" height="52" rx="12" fill="none" stroke="#475569" stroke-dasharray="5 4"/>
    <text x="1005" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#cbd5e1">REFERENCE_ANSWER.md</text>
    <text x="1005" y="588" text-anchor="middle" font-size="12" fill="#94a3b8">never inside the container</text>
  </g>
</svg>
