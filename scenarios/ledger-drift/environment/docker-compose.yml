services:
  main:
    container_name: msmb-ledger-drift
    build:
      context: ../../../docker
      dockerfile: base.Dockerfile
    # No network: the agent cannot reach the public repo (and its answer key) or any other host.
    network_mode: none
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2g
    # Healthy only after setup finishes (a marker file is written as the last setup step), so `up --wait`
    # returns when the agent can actually start.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/.ready"]
      interval: 2s
      timeout: 3s
      retries: 60
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /home/agent:uid=10001,gid=10001,mode=0755,size=64m
      - /workspace/scratch:uid=10001,gid=10001,mode=0755,size=512m
    volumes:
      - ./evidence:/workspace/evidence:ro
    command: ["bash", "-c", "uv venv /workspace/scratch/.venv --quiet && touch /tmp/.ready && sleep infinity"]
