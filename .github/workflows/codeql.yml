name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # weekly, so new queries are applied to old code

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: python, queries: security-extended }
      - uses: github/codeql-action/analyze@v4
        with: { category: "/language:python" }
